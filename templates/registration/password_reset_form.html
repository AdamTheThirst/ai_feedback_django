{% extends "base.html" %}

{% block title %}Сброс пароля{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h1 class="h4 mb-3">Сброс пароля</h1>
        <p class="text-muted">Введите email, указанный при регистрации.</p>
        <form method="post" novalidate>
            {% csrf_token %}
            {{ form.non_field_errors }}
            <div class="mb-3">
                {{ form.email.label_tag }}
                {{ form.email }}
                {{ form.email.errors }}
            </div>
            <button type="submit" class="btn btn-primary w-100">Отправить ссылку</button>
        </form>
        <p class="mt-3 mb-0 text-center"><a href="{% url 'accounts:login' %}">Вернуться ко входу</a></p>
    </div>
</div>
{% endblock %}
