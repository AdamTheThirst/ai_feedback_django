<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Энциклопедия{% endblock %}</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f7f7f9; color: #111; }
        .top-fixed { position: fixed; top: 0; left: 0; right: 0; background: #fff; border-bottom: 1px solid #ddd; padding: 12px 16px; z-index: 10; }
        .bottom-fixed { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #ddd; padding: 10px 16px; display: flex; gap: 8px; z-index: 10; }
        .content-scroll { padding: 64px 16px 80px; min-height: 100vh; box-sizing: border-box; overflow-y: auto; }
        .card { background: white; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px; padding: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .btn { border: 1px solid #333; background: #fff; border-radius: 6px; padding: 8px 10px; text-decoration: none; color: #111; display: inline-block; }
        .btn-primary { background: #111; color: #fff; }
        .pagination { display: flex; gap: 8px; margin-top: 16px; }
        .article-body { white-space: pre-line; line-height: 1.4; }
    </style>
</head>
<body>
{% block layout %}{% endblock %}
</body>
</html>
