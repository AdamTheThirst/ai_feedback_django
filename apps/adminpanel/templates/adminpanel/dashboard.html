{% extends "adminpanel/base.html" %}

{% block title %}Бэкофис{% endblock %}

{% block backoffice_content %}
<div class="row g-2">
    {% for key, value in stats.items %}
        <div class="col-6">
            <div class="card">
                <div class="card-body py-2">
                    <div class="text-muted small">{{ key }}</div>
                    <div class="h5 mb-0">{{ value }}</div>
                </div>
            </div>
        </div>
    {% endfor %}
</div>
{% endblock %}
